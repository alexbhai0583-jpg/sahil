<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sahil Bhai | Telegram Channel</title>

    <meta
        name="description"
        content="Join Sahil Bhai's Telegram channel for daily updates, news and exclusive content."
    >

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <main class="page">

        <section class="card">

            <!-- Top Label -->
            <div class="channel-label">
                <span class="status-dot"></span>
                <span>LIVE TELEGRAM CHANNEL</span>
            </div>

            <!-- Heading -->
            <h1>SAHIL BHAI</h1>

            <!-- Description -->
            <p class="description">
                Your daily dose of updates, news, and
                <br class="desktop-break">
                exclusive content — delivered straight to
                <br class="desktop-break">
                Telegram.
            </p>

            <!-- Features -->
            <div class="features">

                <div class="feature">
                    <span class="emoji">⚡</span>
                    <span>Daily Posts</span>
                </div>

                <div class="feature">
                    <span class="emoji">🔒</span>
                    <span>100% Free</span>
                </div>

                <div class="feature">
                    <span class="emoji">🚀</span>
                    <span>No Spam</span>
                </div>

            </div>

            <!-- CTA -->
            <a
                href="https://t.me/+OHycolLxBjw5YjRl"
                target="_blank"
                rel="noopener noreferrer"
                class="telegram-button"
            >
                <span class="telegram-icon">
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M21.8 3.2c-.3-.3-.8-.4-1.2-.2L2.9 10.1c-.7.3-.7 1.3 0 1.6l4.5 1.6 1.7 5.5c.2.7 1.1.9 1.6.4l2.5-2.5 4.7 3.5c.6.4 1.4.1 1.6-.6l3.1-15.1c.1-.5-.1-1-.6-1.3ZM9.1 14.3l-.4 2.5-.9-3-3.1-1.1 12.8-5-8.4 6.6Zm1.5 2.1.2-1.4 2.2 1.6-2.4 2.4v-2.6Zm7.3 1.1-6.2-4.6 7.5-5.9-1.3 10.5Z"
                        />
                    </svg>
                </span>

                <span>Join Now on Telegram</span>
            </a>

            <!-- CTA subtitle -->
            <p class="subtext">
                Tap to join instantly — no sign-up needed
            </p>

            <!-- Bottom Branding -->
            <div class="branding">
                <div class="brand-title">
                    S A H I L &nbsp; B H A I &nbsp; F U L L &nbsp; P O W E R
                </div>

                <div class="made-by">
                    Made by <strong>SAHIL ADS</strong>
                </div>
            </div>

        </section>

    </main>

</body>
</html>
